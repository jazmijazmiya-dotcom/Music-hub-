*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#ffdce8;min-height:100vh;overflow-x:hidden}
.leaf{position:fixed;font-size:70px;opacity:.75;z-index:0}
.leaf1{top:20px;left:-10px;transform:rotate(-25deg)}
.leaf2{top:120px;right:-15px;transform:rotate(25deg)}
.leaf3{bottom:20px;left:-15px;transform:rotate(20deg)}
.leaf4{bottom:100px;right:-10px;transform:rotate(-20deg)}
.navbar{background:#fff;padding:18px 15px;text-align:center;position:relative;z-index:2;box-shadow:0 3px 12px rgba(0,0,0,.08)}
.navbar h1{color:#4d8050;margin-bottom:12px}
.nav-links{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.nav-links a{text-decoration:none;background:#c9e8c5;color:#315b35;padding:8px 13px;border-radius:20px;font-size:14px;font-weight:bold}
.pop-box{position:relative;z-index:1;background:#fff;width:90%;max-width:700px;margin:35px auto;padding:25px 20px;border-radius:30px;box-shadow:0 12px 35px rgba(80,120,80,.18);border:4px solid #e5f3df}
.player-box{background:#fff0f5;padding:15px;border-radius:20px;margin-bottom:20px;border:2px solid #e5f3df;text-align:center}
.player-box iframe{width:100%;height:220px;border:none;border-radius:15px;display:block}
#nowPlaying{color:#4d8050;font-weight:bold;font-size:14px;margin-top:10px}
.search-box{text-align:center;margin-bottom:20px}
.search-box input{width:90%;padding:11px 16px;border:2px solid #c9e8c5;border-radius:20px;outline:none;font-size:14px;color:#555}
.artist{margin-bottom:22px}
.artist h2{font-size:22px;color:#4d8050;margin-bottom:10px}
.song{display:flex;align-items:center;justify-content:space-between;background:#fff0f5;padding:10px 12px;margin:7px 0;border-radius:15px;border:2px solid #f6dce6}
.song-name{color:#555;font-size:14px}
.play-btn{background:#c9e8c5;color:#315b35;border:none;padding:7px 12px;border-radius:20px;font-size:13px;font-weight:bold;cursor:pointer}
footer{position:relative;z-index:1;text-align:center;padding:20px;color:#4d8050;font-size:14px}
</style>

function playSong(videoId, songName){
  document.getElementById("musicPlayer").src =
    "https://www.youtube.com/embed/" + videoId + "?autoplay=1";
  document.getElementById("nowPlaying").textContent =
    "Now playing: " + songName;
  window.scrollTo({top:0,behavior:"smooth"});
}

const list=document.getElementById("list");

D.forEach(function(a){
  const box=document.createElement("div");
  box.className="artist";
  const h=document.createElement("h2");
  h.textContent=a[0];
  box.append(h);
  a[1].split(";").forEach(function(s){
    const i=s.lastIndexOf("|");
    const name=s.slice(0,i);
    const id=s.slice(i+1);
    const row=document.createElement("div");
    row.className="song";
    const n=document.createElement("span");
    n.className="song-name";
    n.textContent=name;
    const b=document.createElement("button");
    b.className="play-btn";
    b.textContent="Play";
    b.addEventListener("click",function(){playSong(id,name);});
    row.append(n,b);
    box.append(row);
  });
  list.append(box);
});

function searchSongs(){
  const q=document.getElementById("search").value.toLowerCase();
  document.querySelectorAll(".artist").forEach(function(a){
    a.style.display=a.innerText.toLowerCase().includes(q)?"block":"none";
  });
}
